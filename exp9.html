<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ziv Celestial | Experiment 9 – Validation & Routing</title><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f7f5f0;color:#292522}header{background:#241b18;color:white;padding:22px 6%;display:flex;justify-content:space-between;flex-wrap:wrap}header a{color:#f4c98b;margin-left:15px}.wrap{max-width:900px;margin:28px auto;padding:0 18px}.panel{background:white;padding:24px;border-radius:14px;box-shadow:0 5px 18px #0001}.hero{background:#fff0dc;padding:20px;border-radius:14px;margin-bottom:18px}label{display:block;font-weight:bold;margin:12px 0 5px}input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px}input.ng-invalid.ng-touched,select.ng-invalid.ng-touched{border:2px solid #c0392b}input.ng-valid.ng-touched,select.ng-valid.ng-touched{border:2px solid #27824a}.error{color:#b3261e;font-size:13px}.hint{color:#666;font-size:13px}button{margin-top:16px;background:#8d4428;color:white;border:0;padding:11px 18px;border-radius:8px}button:disabled{opacity:.45;cursor:not-allowed}.route-links{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.route-links a{background:#eee3d7;color:#54301f;padding:9px 12px;border-radius:8px;text-decoration:none}</style></head>
<body ng-app="zivRoutes"><header><strong>ZIV CELESTIAL</strong><nav><select aria-label="Current page: Experiment 9. Select an experiment to navigate." onchange="window.location.href=this.value" style="width:auto;max-width:calc(100vw - 24px);padding:9px 12px;border:1px solid #d5d0ca;border-radius:8px;background:#fff;color:#292522;font:14px Arial,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;"><option value="exp1.html">Experiment 1</option><option value="exp2.html">Experiment 2</option><option value="exp3.html">Experiment 3</option><option value="exp4.html">Experiment 4</option><option value="exp5.html">Experiment 5</option><option value="exp6.html">Experiment 6</option><option value="exp7.html">Experiment 7</option><option value="exp8.html">Experiment 8</option><option value="exp9.html" selected>Experiment 9</option><option value="exp10.html">Experiment 10</option></select></nav></header>
<main class="wrap"><section class="hero"><h1>Experiment 9 · Form Validation and Routing Using AngularJS</h1><p>AngularJS form validation and four routed views using <code>ngRoute</code>.</p></section>
<div class="route-links"><a href="#!/home">Home</a><a href="#!/register">Registration</a><a href="#!/about">About</a><a href="#!/contact">Contact</a></div><div ng-view></div></main>
<script>
angular.module('zivRoutes',['ngRoute']).config(function($routeProvider){$routeProvider.when('/home',{template:'<section class="panel"><h2>Welcome to Ziv Celestial</h2><p>Discover campus food, explore the menu and register for a smoother ordering experience.</p><p>Use the navigation above to visit all four routed pages.</p></section>'}).when('/register',{templateUrl:'register-view.html'}).when('/about',{template:'<section class="panel"><h2>About Ziv Celestial</h2><p>A campus-focused food pre-order concept built as a Web Technology Lab project.</p></section>'}).when('/contact',{template:'<section class="panel"><h2>Contact</h2><p>Email: support@zivcelestial.example</p><p>For this academic prototype, contact details are illustrative.</p></section>'}).otherwise({redirectTo:'/home'});});
angular.module('zivRoutes').run(function($templateCache){$templateCache.put('register-view.html',`<section class="panel" ng-controller="RegisterCtrl"><h2>Customer Registration</h2><form name="regForm" novalidate ng-submit="submit()">
<label>Full Name</label><input name="name" ng-model="user.name" required ng-minlength="3" placeholder="Enter full name"><span class="error" ng-show="regForm.name.$touched && regForm.name.$invalid">Enter at least 3 characters.</span>
<label>Password</label><input type="password" name="password" ng-model="user.password" required ng-minlength="6" placeholder="Minimum 6 characters"><span class="error" ng-show="regForm.password.$touched && regForm.password.$invalid">Password must contain at least 6 characters.</span>
<label>Age</label><input type="number" name="age" ng-model="user.age" min="18" max="30" required placeholder="18–30"><span class="error" ng-show="regForm.age.$touched && regForm.age.$invalid">Age must be between 18 and 30.</span>
<label>Mobile Number</label><input name="mobile" ng-model="user.mobile" ng-pattern="/^[0-9]{10}$/" required placeholder="10-digit mobile number"><span class="error" ng-show="regForm.mobile.$touched && regForm.mobile.$invalid">Enter exactly 10 digits.</span>
<label>Email</label><input type="email" name="email" ng-model="user.email" required placeholder="name@example.com"><span class="error" ng-show="regForm.email.$touched && regForm.email.$invalid">Enter a valid email address.</span>
<label>Gender</label><select name="gender" ng-model="user.gender" required><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select>
<label>State</label><select name="state" ng-model="user.state" required><option value="">Select state</option><option>Tamil Nadu</option><option>Kerala</option><option>Karnataka</option><option>Andhra Pradesh</option><option>Telangana</option><option>Other</option></select>
<button type="submit" ng-disabled="regForm.$invalid">Submit Registration</button><p class="hint">The submit button is enabled only when every field is valid.</p><p class="error" ng-if="success">{{success}}</p></form></section>`);});
angular.module('zivRoutes').controller('RegisterCtrl',function($scope){$scope.user={};$scope.submit=function(){$scope.success='Registration details validated successfully (demo only).';};});
</script></body></html>
