<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziv Celestial | Customer Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }

       header {
    color: white;
    text-align: center;
    padding: 35px 20px;
    background-image:
        linear-gradient(rgba(0, 40, 25, 0.65), rgba(0, 40, 25, 0.65)),
        url("images/burger.jpg");
    background-size: cover;
    background-position: center;
    border-radius: 0 0 15px 15px;
        }

        header img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: white;
            padding: 8px;
            border-radius: 12px;
        }

        header h1 {
            font-size: 42px;
            margin: 15px 0 5px;
        }

        header p {
            font-size: 20px;
            margin: 0;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            color: #2daa64;
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        input[type="color"],
        input[type="range"],
        input[type="file"] {
            width: auto;
        }

        .buttons {
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            background: #2daa64;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>

</head>

<body>
    <div style="position:fixed;top:12px;right:12px;z-index:1000;">
        <select aria-label="Current page: Experiment 2. Select an experiment to navigate." onchange="window.location.href=this.value" style="width:auto;max-width:calc(100vw - 24px);padding:9px 12px;border:1px solid #d5d0ca;border-radius:8px;background:#fff;color:#292522;font:14px Arial,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;">
            <option value="exp1.html">Experiment 1</option>
            <option value="exp2.html" selected>Experiment 2</option>
            <option value="exp3.html">Experiment 3</option>
            <option value="exp4.html">Experiment 4</option>
            <option value="exp5.html">Experiment 5</option>
            <option value="exp6.html">Experiment 6</option>
            <option value="exp7.html">Experiment 7</option>
            <option value="exp8.html">Experiment 8</option>
            <option value="exp9.html">Experiment 9</option>
            <option value="exp10.html">Experiment 10</option>
        </select>
    </div>

   <header>
    <img src="images/logo.png" alt="Ziv Celestial Logo">
    <h1>Ziv Celestial</h1>
    <p>Customer Registration</p>
    </header>

    <div class="container">

        <h2>Register</h2>

        <form>

            <label>Customer Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" placeholder="example@gmail.com" required>

            <label>Password</label>
            <input type="password" required>

            <label>Mobile Number</label>
            <input type="number" min="6000000000" max="9999999999" required>

            <label>Date of Birth</label>
            <input type="date">

            <label>Gender</label><br>

            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other

            <br><br>

            <label>Food Preference</label><br>

            <input type="checkbox"> Vegetarian
            <input type="checkbox"> Non-Vegetarian
            <input type="checkbox"> Vegan

            <br><br>

            <label>Preferred Meal</label>

            <select>

                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Snacks</option>
                <option>Dinner</option>

            </select>

            <label>Delivery Address</label>

            <textarea rows="4" placeholder="Enter your address"></textarea>

            <label>Favourite Theme Color</label><br>

            <input type="color">

            <br><br>

            <label>Upload Profile Picture</label><br>

            <input type="file">

            <br><br>

            <label>Ordering Experience</label><br>

            <input type="range" min="1" max="10">

            <div class="buttons">

                <input type="submit" value="Register">

                <input type="reset" value="Clear">

            </div>

        </form>

    </div>

    <footer>

        <p>© 2026 Ziv Celestial | Food Pre-Order Platform</p>

    </footer>

</body>

</html>
